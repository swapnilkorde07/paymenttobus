
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paymenttobus.sk - Payment</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f3f5fa;
 font-family:Arial,sans-serif;color:#172033;
}
.container{
 max-width:460px;margin:35px auto;padding:25px;
 background:white;border-radius:18px;
 box-shadow:0 8px 30px #0001;
}
h1{text-align:center;color:#2456c5}
.sub{text-align:center;color:#777}
label{display:block;font-weight:bold;margin:17px 0 7px}
input{
 width:100%;padding:13px;border:1px solid #ddd;
 border-radius:9px;font-size:15px;
}
.qr{text-align:center;margin:22px 0}
.qr img{width:220px;max-width:100%;border-radius:10px}
button{
 width:100%;padding:15px;border:0;border-radius:9px;
 background:#2456c5;color:white;font-size:16px;
 cursor:pointer;margin-top:20px;
}
button:disabled{opacity:.6}
.note{font-size:12px;color:#777;text-align:center}
#status{text-align:center;margin-top:15px}
</style>
</head>
<body>
<div class="container">
<h1>Paymenttobus.sk</h1>
<p class="sub">Make Your Payment</p>

<label>Payment Amount (₹)</label>
<input id="amount" type="number" min="1"
 step="0.01" placeholder="Enter amount" required>

<div class="qr">
<h3>Scan QR & Pay</h3>
<img src="qr.png" alt="UPI Payment QR">
<p>Scan using any UPI app</p>
</div>

<form id="paymentForm">
<label>Your Name</label>
<input id="name" required placeholder="Enter your name">

<label>Mobile Number</label>
<input id="mobile" type="tel" required
 pattern="[0-9]{10}" placeholder="10 digit mobile number">

<label>UTR / Transaction ID</label>
<input id="utr" required
 placeholder="Enter transaction reference">

<label>Payment Screenshot</label>
<input id="screenshot" type="file"
 accept="image/png,image/jpeg" required>

<button id="submitBtn" type="submit">
Submit Payment
</button>
</form>

<p class="note">
Payment will remain pending until manually verified.
Do not upload passwords or UPI PIN.
</p>
<div id="status"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5oFN17A3GlLJ8QIQexI0nNjRmf7jzScRW3A56o7HUAADX5lW7TH9uVnUSkX3EwKOyeg/exec";

document.getElementById("paymentForm")
.addEventListener("submit", async function(e){
 e.preventDefault();

 const amount = Number(document.getElementById("amount").value);
 const file = document.getElementById("screenshot").files[0];

 if(!amount || amount <= 0){
  alert("Enter a valid amount"); return;
 }
 if(!file || file.size > 2*1024*1024){
  alert("Upload an image under 2 MB"); return;
 }

 const btn = document.getElementById("submitBtn");
 const status = document.getElementById("status");
 btn.disabled = true;
 btn.textContent = "Submitting...";

 try{
  const base64 = await new Promise((resolve,reject)=>{
   const reader = new FileReader();
   reader.onload = ()=>resolve(reader.result.split(",")[1]);
   reader.onerror = reject;
   reader.readAsDataURL(file);
  });

  const payload = {
   amount: amount,
   name: document.getElementById("name").value.trim(),
   mobile: document.getElementById("mobile").value.trim(),
   utr: document.getElementById("utr").value.trim(),
   fileName: file.name,
   mimeType: file.type,
   image: base64
  };

  await fetch(SCRIPT_URL,{
   method:"POST",
   mode:"no-cors",
   headers:{"Content-Type":"text/plain;charset=utf-8"},
   body:JSON.stringify(payload)
  });

  status.textContent =
   "Submission sent. Please wait for payment verification.";
  status.style.color="green";
  document.getElementById("paymentForm").reset();
  document.getElementById("amount").value="";
 }catch(err){
  status.textContent="Submission failed. Please try again.";
  status.style.color="red";
 }
 btn.disabled=false;
 btn.textContent="Submit Payment";
});
</script>
</body>
</html>
